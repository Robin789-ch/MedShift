num_employees = 8
num_weeks = 3
shifts = ["O", "D", "N", "F", "R", "H"]
employee_overtime_hours = [0, 0, 0, 0, 0, 0, 0, 0]

# Fixed assignment: [employee, shift, day].
# This fixes the first 2 days of the schedule.
fixed_assignments = [
  [0, "O", 0],
  [1, "O", 0],
  [2, "D", 0],
  [3, "D", 0],
  [4, "D", 0],
  [5, "D", 0],
  [6, "D", 3],
  [0, "D", 1],
  [1, "D", 1],
  [2, "D", 1],
  [3, "D", 1],
  [4, "D", 1],
  [5, "O", 1],
  [6, "O", 1],
]

# Request: [employee, shift, day, weight].
# A negative weight indicates that the employee desires this assignment.
requests = [
  [3, "O", 5, -4],
  [5, "N", 10, -4],
  [2, "N", 4, 6],
]

# Shift constraints on continuous sequence:
# [shift, hard_min, soft_min, min_penalty, soft_max, hard_max, max_penalty]
shift_constraints = [
  ["O", 1, 1, 5, 2, 100, 3],
  ["D", 1, 2, 5, 5, 6, 0],
  ["N", 1, 2, 20, 3, 4, 5],
]

# Weekly sum constraints on shift days:
# [shift, hard_min, soft_min, min_penalty, soft_max, hard_max, max_penalty]
weekly_sum_constraints = [
  ["O", 1, 2, 7, 2, 7, 2],
]

# Penalized transitions:
# [previous_shift, next_shift, penalty], where penalty = 0 means forbidden.
penalized_transitions = [
  ["N", "D", 0],
  ["O", "R", -2],
  ["R", "O", -2],
]

# Daily demands for demand-covering shifts [day, night] for each day of the week
# starting on Monday.
weekly_cover_demands = [
  [5, 1],
  [5, 1],
  [4, 2],
  [5, 1],
  [4, 2],
  [3, 3],
  [4, 1],
]

# Penalty for exceeding the cover constraint per demand-covering shift type.
excess_cover_penalties = [10, 20]

department_fixed_assignments = []
department_requests = []
department_switch_penalty = 1

[[departments]]
id = "day"
name = "Day"
shift = "D"
symbol = "D"
color = "#ffe08a"
duration_hours = 8
requirements = [5, 5, 4, 5, 4, 3, 4]

[[departments]]
