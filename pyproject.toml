[tool.uv.workspace]
members = [
    "packages/contracts",
    "services/agent",
    "services/optimizer",
]

[tool.uv.sources]
medshift-contracts = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.19,<2",
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = [
    "services/agent/tests",
    "services/optimizer/tests",
]

[tool.mypy]
python_version = "3.14"
strict = true
